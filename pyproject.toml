[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "./"
files = ["aiosu"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[tool.isort]
add_imports = ["from __future__ import annotations"]
force_single_line = true
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "aiosu"
version = "2.5.1"
description = "Simple and fast osu! API v1 and v2 library"
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
authors = [{ name = "Nice Aesthetics", email = "nice@aesth.dev" }]
license = "AGPL-3.0-or-later"
readme = "README.rst"
keywords = ["osu!", "osu", "api"]
dependencies = [
    "aiohttp>=3.14.4,<4",
    "aiolimiter>=1.3.0,<2",
    "emojiflags>=0.1.1",
    "orjson>=3.12.0,<4",
    "pydantic>=2.13.5,<3",
    "pyjwt>=2.15.1,<3",
]

[project.urls]
repository = "https://github.com/NiceAesth/aiosu"
documentation = "https://aiosu.readthedocs.io/"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-mock>=3.16.0,<4",
]
docs = ["Sphinx>=9.1.0,<10", "furo>=2025.12.19"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.16.0"
mypy = "^2.4.0"
sphinx = "^9.1.0"
furo = "^2025.12.19"
pytest-cov = "^7.1.0"
black = "^26.10.0"
isort = "^9.0.2"
pre-commit = "^4.6.2"
python-dotenv = "^1.2.4"

[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"
